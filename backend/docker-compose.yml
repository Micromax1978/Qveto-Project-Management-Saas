# Local demo / simple deployment: PostgreSQL + API.
#   cp .env.example .env   (set JWT_SECRET)
#   docker compose up --build
#   docker compose exec api node scripts/seed-demo.js
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qveto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qveto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/qveto?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: "5000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      UPLOAD_DIR: /data/attachments
      LOG_DIR: /data/logs
    ports:
      - "5000:5000"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Rounded Background Container -->
  <rect width="40" height="40" rx="10" fill="#2563EB" />
  
  <!-- Stylized Connected Nodes forming 'T' -->
  <!-- Top Horizontal Bar Line -->
  <line x1="10" y1="12" x2="30" y2="12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Vertical Stem Line -->
  <line x1="20" y1="12" x2="20" y2="30" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Workflow Nodes (Circles) -->
  <!-- Left Node -->
  <circle cx="10" cy="12" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <!-- Center Top Node -->
  <circle cx="20" cy="12" r="4.2" fill="#93C5FD" stroke="#FFFFFF" stroke-width="2" />
  <!-- Right Node -->
  <circle cx="30" cy="12" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <!-- Bottom Stem Node -->
  <circle cx="20" cy="30" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
</svg>